name: v1 Preview

# v1 alpha preview under /next/; never touches the stable site, its receiver or its secrets.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ods-next-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Immutable optional-extension CSS baseline.

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install browser for mandatory runtime and gallery checks
        run: pnpm -C apps/gallery exec playwright install --with-deps chromium

      - name: Package build, types, runtime, CSS budgets, and pack dry-run
        run: pnpm verify:publish

      - name: Verify bounded shared catalog contracts
        run: pnpm catalog:test && pnpm catalog:check

      - run: pnpm gallery:build
      - name: Verify emitted consumer CSS adoption order
        run: node apps/gallery/scripts/test-consumer-css-order.mjs
      - run: pnpm catalog:storybook:typecheck
      - run: pnpm catalog:storybook:build
      - name: Verify the production catalog preview
        run: pnpm catalog:browser:test

      - run: pnpm gallery:test

      - name: Test bounded site assembly and deploy receivers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*deploy.py' -v

      - name: Build the gallery for /next/ with the alpha banner
        env:
          ODS_GALLERY_BASE: /next/
          VITE_ODS_PREVIEW: '1'
        run: pnpm gallery:build

      - name: Assemble verified preview site
        env:
          RELEASE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 .github/scripts/assemble-next.py
          --sha "$RELEASE_SHA" --run-id "$SOURCE_RUN_ID" --repository "$SOURCE_REPOSITORY"
          --gallery apps/gallery/dist --storybook apps/storybook/storybook-static --output site-next

      - name: Serve the assembled preview under /next/ and resolve its assets
        run: python3 .github/scripts/smoke-next.py site-next

      - name: Upload verified preview site
        uses: actions/upload-artifact@v4
        with:
          name: next-${{ github.sha }}
          path: site-next/
          if-no-files-found: error

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/gallery/playwright-report/
          if-no-files-found: ignore

  deploy:
    needs: build
    if: github.ref == 'refs/heads/develop' && github.repository_owner == 'Osmova' && vars.DEPLOY_NEXT_SSH_HOST != ''
    runs-on: ubuntu-latest
    environment: preview
    env:
      RELEASE_SHA: ${{ github.sha }}
      SOURCE_RUN_ID: ${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Reject superseded preview build
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/develop" --jq .object.sha)" = "$RELEASE_SHA"

      - name: Download verified preview site
        uses: actions/download-artifact@v4
        with:
          name: next-${{ github.sha }}
          path: site-next

      - name: Send verified preview to restricted receiver
        shell: bash
        env:
          DEPLOY_NEXT_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_NEXT_SSH_PRIVATE_KEY }}
          DEPLOY_NEXT_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_NEXT_SSH_KNOWN_HOSTS }}
          DEPLOY_NEXT_SSH_HOST: ${{ vars.DEPLOY_NEXT_SSH_HOST }}
          DEPLOY_NEXT_SSH_USER: ${{ vars.DEPLOY_NEXT_SSH_USER }}
          DEPLOY_NEXT_SSH_PORT: ${{ vars.DEPLOY_NEXT_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_NEXT_SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_NEXT_SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_NEXT_SSH_PORT" =~ ^[0-9]+$ ]]
          test -n "$DEPLOY_NEXT_SSH_PRIVATE_KEY" && test -n "$DEPLOY_NEXT_SSH_KNOWN_HOSTS"
          umask 077
          SSH_DIR="$(mktemp -d "$RUNNER_TEMP/ods-next-ssh.XXXXXX")"
          trap 'rm -rf -- "$SSH_DIR"' EXIT
          printf '%s\n' "$DEPLOY_NEXT_SSH_PRIVATE_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$DEPLOY_NEXT_SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/key" "$SSH_DIR/known_hosts"
          unset DEPLOY_NEXT_SSH_PRIVATE_KEY DEPLOY_NEXT_SSH_KNOWN_HOSTS
          tar -C site-next -czf "$SSH_DIR/site.tar.gz" .
          # Check again immediately before sending bytes (not just before download).
          test "$(gh api "repos/$GH_REPO/git/ref/heads/develop" --jq .object.sha)" = "$RELEASE_SHA"
          ssh -F /dev/null -T -i "$SSH_DIR/key" -p "$DEPLOY_NEXT_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" -o ConnectTimeout=20 \
            "$DEPLOY_NEXT_SSH_USER@$DEPLOY_NEXT_SSH_HOST" "deploy-next $RELEASE_SHA $SOURCE_RUN_ID" < "$SSH_DIR/site.tar.gz"

      - name: Verify public HTTPS preview and static routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import urllib.error
          import urllib.request
          from urllib.parse import urljoin, urlsplit

          host = 'design-system.osmova.com'
          base = 'https://' + host
          def get(path):
              with urllib.request.urlopen(base + path, timeout=30) as response:
                  if urlsplit(response.url).scheme != 'https' or urlsplit(response.url).netloc != host:
                      raise RuntimeError('Unexpected health-check redirect')
                  return response.read()

          def verified_file(path):
              assert path.startswith('/next/'), path
              data = get(path)
              local = (Path('site-next') / urlsplit(path).path.removeprefix('/next/')).resolve()
              assert local.is_relative_to(Path('site-next').resolve()), path
              assert hashlib.sha256(data).digest() == hashlib.sha256(local.read_bytes()).digest(), path
              return data

          release = json.loads(get('/next/release.json?sha=' + os.environ['RELEASE_SHA']))
          assert release == {'sha': os.environ['RELEASE_SHA'], 'run_id': os.environ['SOURCE_RUN_ID'],
                             'repository': os.environ['GH_REPO']}, release
          for path in ('/next/index.html', '/next/storybook/index.html', '/next/storybook/iframe.html'):
              html = verified_file(path).decode('utf-8')
              assert '<html' in html.lower(), path
              assets = re.findall(r'(?:src|href)=["\']([^"\']+\.(?:js|css)(?:\?[^"\']*)?)["\']', html)
              assert assets, 'No static assets in ' + path
              for asset in assets:
                  url = urlsplit(urljoin(base + path, asset))
                  assert url.scheme == 'https' and url.netloc == host, asset
                  verified_file(url.path + ('?' + url.query if url.query else ''))
          assert get('/next/') == get('/next/index.html')
          assert get('/next/storybook/') == get('/next/storybook/index.html')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          for directory in ('/next', '/next/storybook'):
              try:
                  urllib.request.build_opener(NoRedirect).open(base + directory, timeout=30)
                  raise RuntimeError(directory + ' must redirect')
              except urllib.error.HTTPError as error:
                  assert error.code in (301, 302, 307, 308), error.code
                  assert urljoin(base + directory, error.headers['Location']) == base + directory + '/'
          for prefix in ('/next/assets/', '/next/storybook/assets/'):
              try:
                  get(prefix + 'ods-missing-' + os.environ['RELEASE_SHA'] + '.js')
                  raise RuntimeError('Missing asset returned success')
              except urllib.error.HTTPError as error:
                  assert error.code == 404, error.code
          assert get('/next/unknown-route') == get('/next/index.html'), 'SPA fallback'
          assert get('/') != get('/next/index.html'), 'Domain root must stay the stable site'
          PY
          # No automatic rollback: the operator retains previous releases for recovery.
